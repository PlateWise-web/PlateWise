<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email verification</title>
<style>
  :root { --bg:#f4f7f5; --ink:#16241d; --accent:#1f7a4d; --accent-ink:#fff; --danger:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101a15; --ink:#e7f0eb; --accent:#4fcf93; --accent-ink:#08170f; --danger:#ff8a80; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; padding: 24px; text-align: center;
    background: var(--bg); color: var(--ink);
    font: 500 1.375rem/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  p { margin: 0; max-width: 28ch; }
  p.failed { color: var(--danger); }
  a.btn {
    display: inline-block; padding: 12px 22px; border-radius: 8px;
    background: var(--accent); color: var(--accent-ink);
    font-size: 1rem; font-weight: 600; text-decoration: none;
  }
  a.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <p id="message" role="status" aria-live="polite"></p>
  <a id="continue" class="btn" hidden
     href="https://platewiseog.vercel.app/">
    Go to Platewise
  </a>

<script>
  // Supabase sends the user here after they click the email link.
  // Success: tokens (#access_token=...) or a ?code=... arrive in the URL.
  // Failure: #error=...&error_code=... (or the same in the query string).
  const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const query = new URLSearchParams(window.location.search);
  const get = (k) => hash.get(k) || query.get(k);

  const failed = get('error') || get('error_code') || get('error_description');
  const succeeded = !failed && (get('access_token') || get('code') || get('token_hash') || get('type'));

  const message = document.getElementById('message');
  if (succeeded) {
    message.textContent = 'Email verified successfully.';
    document.getElementById('continue').hidden = false;
  } else {
    message.textContent = 'Verification failed. Try again.';
    message.className = 'failed';
  }
</script>
</body>
</html>
